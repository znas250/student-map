body{font-family:'Malgun Gothic','Segoe UI',sans-serif;background:#f5f5f5}

#prog{width:300px;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-bottom:8px}
#progBar{width:0%;height:100%;background:linear-gradient(90deg,#1a73e8,#34a853);transition:width .3s}
#progTxt{font-size:12px;color:#666}
#pw{position:fixed;top:0;left:0;right:0;bottom:0;background:#1e3a5f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999}

#pw button{margin-top:12px;padding:10px 40px;font-size:14px;font-weight:600;background:#34a853;color:#fff;border:none;border-radius:8px;cursor:pointer}
#pw button:hover{background:#2e9649}
#pw .err{color:#ff6b6b;font-size:13px;margin-top:8px;height:20px}
.hidden{display:none!important}
</style>

<div id="pw">
  <h2>학생 주소지 지도</h2>
  <input type="password" id="pwInput" placeholder="비밀번호 입력" autofocus>
  <button onclick="checkPw()">확인</button>
  <div class="err" id="pwErr"></div>
</div>
<script>
function checkPw(){
  var v=document.getElementById('pwInput').value;
  // SHA-256 hash of "1111"
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(h){
    var ha=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
    if(ha==='0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c'){
      document.getElementById('pw').classList.add('hidden');
      startApp();
    } else {
      document.getElementById('pwErr').textContent='비밀번호가 틀렸습니다.';
      document.getElementById('pwInput').value='';
      document.getElementById('pwInput').focus();
    }
  });
}
document.getElementById('pwInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkPw()});
</script>

var aT=new Set(['외국인','학령기','성인','위탁']),aN=new Set(),mp,clusterer,markers=[];
S.forEach(function(s){if(s.a)aN.add(s.a)});

// Load Kakao SDK dynamically with https://
function startApp(){
document.getElementById('ld').classList.remove('hidden');
var ks=document.createElement('script');
ks.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey=964bc36e376b3e0156a62fbf3f99a4ba&libraries=services,clusterer&autoload=false';
ks.onload=function(){
  document.getElementById('progTxt').textContent='카카오맵 초기화 중...';
  kakao.maps.load(initMap);
};
ks.onerror=function(){
  document.getElementById('progTxt').innerHTML='<span style="color:red">카카오맵 로드 실패.</span><br>인터넷 연결 및 API 키/도메인 설정을 확인해주세요.<br><small>현재 URL: '+location.href+'</small>';
};
document.head.appendChild(ks);
} // end startApp

function initMap(){
  document.getElementById('progTxt').textContent='지도 생성 중...';
  mp=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5,127.0),level:10});
  mp.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  
  var gc=new kakao.maps.services.Geocoder();
  var pcs=Object.keys(PC);
  var total=pcs.length,done=0,coordMap={};
  
  // Check localStorage cache
  var cacheKey='student_map_geocache_v2';
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){
      coordMap=JSON.parse(cached);
      var hits=0;
      pcs.forEach(function(pc){if(coordMap[pc])hits++});
      if(hits>total*0.8){
        // Use cache, only geocode missing ones
        pcs=pcs.filter(function(pc){return !coordMap[pc]});
        done=total-pcs.length;
        total=total;
      } else {
        coordMap={};
      }
    }
  }catch(e){}
  
  if(pcs.length===0){finish();return}
  
  document.getElementById('progTxt').textContent='주소 좌표 변환 중... ('+done+'/'+total+')';
  
  var BATCH=6,idx=0;
  function nextBatch(){
    if(idx>=pcs.length){
      // Save to cache
      try{localStorage.setItem(cacheKey,JSON.stringify(coordMap))}catch(e){}
      finish();return;
    }
    var batch=pcs.slice(idx,idx+BATCH);
    idx+=BATCH;
    var pending=batch.length;
    batch.forEach(function(pc){
      var entry=PC[pc];
      if(entry.addr){
        gc.addressSearch(entry.addr,function(result,status){
          if(status===kakao.maps.services.Status.OK&&result.length>0){
            coordMap[pc]=[parseFloat(result[0].y),parseFloat(result[0].x)];
          } else if(entry.fb){
            coordMap[pc]=entry.fb;
          }
          pending--;done++;
          updProg();
          if(pending===0)setTimeout(nextBatch,100);
        });
      } else if(entry.fb){
        coordMap[pc]=entry.fb;
        pending--;done++;
        updProg();
        if(pending===0)setTimeout(nextBatch,100);
      } else {pending--;done++;if(pending===0)setTimeout(nextBatch,100)}
    });
  }
  function updProg(){
    if(done%20===0||done>=total){
      var pct=Math.round(done/total*100);
      document.getElementById('progBar').style.width=pct+'%';
      document.getElementById('progTxt').textContent='주소 좌표 변환 중... ('+done+'/'+total+') '+pct+'%';
    }
  }
  
  function finish(){
    document.getElementById('progTxt').textContent='마커 생성 중...';
    S.forEach(function(s){
      var c=coordMap[s.p];
      if(c){s.y=c[0];s.x=c[1]}
    });
    document.getElementById('ld').style.display='none';
    buildUI();render();
  }
  nextBatch();
}

function vis(){return S.filter(function(s){if(!s.y)return false;if(!aT.has(s.t))return false;if(s.t==='외국인'&&s.a&&!aN.has(s.a))return false;return true})}

function makeGroupContent(group){
  var maxShow=20;
  var h='<div style="padding:8px;font-size:12px;line-height:1.4;width:240px;max-height:280px;overflow-y:auto;box-sizing:border-box">';
  h+='<div style="font-weight:700;font-size:12px;margin-bottom:4px;border-bottom:1px solid #ddd;padding-bottom:4px">우편번호 '+group[0].p+' ('+group.length+'명)</div>';
  var show=group.slice(0,maxShow);
  show.forEach(function(s,i){
    var col=(s.t==='외국인'&&s.a)?(NC[s.a]||'#95a5a6'):TC[s.t];
    h+='<div style="padding:2px 0;'+(i>0?'border-top:1px solid #f5f5f5;':'')+'">';
    h+='<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+col+';margin-right:3px;vertical-align:middle"></span>';
    h+='<span style="font-weight:600;font-size:11px">'+s.n+'</span> <span style="color:#999;font-size:10px">'+s.t;
    if(s.a)h+=' · '+s.a;
    h+='</span><br><span style="color:#777;font-size:10px;margin-left:10px">'+s.d+'</span>';
    h+='</div>';
  });
  if(group.length>maxShow) h+='<div style="color:#999;font-size:10px;padding-top:4px;text-align:center">외 '+(group.length-maxShow)+'명...</div>';
  h+='</div>';
  return h;
}

function render(){
  if(clusterer)clusterer.clear();
  markers=[];
  var v=vis();
  var iw=new kakao.maps.InfoWindow({zIndex:1});
  kakao.maps.event.addListener(mp,'click',function(){iw.close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')iw.close()});

  // Group students by postal code for popup content
  var pcGroups={};
  v.forEach(function(s){
    if(!s.y)return;
    if(!pcGroups[s.p])pcGroups[s.p]=[];
    pcGroups[s.p].push(s);
  });

  // Create one marker PER STUDENT so clusterer counts students correctly
  // All students with same postal code share coordinates
  var svgCache={};
  v.forEach(function(s){
    if(!s.y)return;
    var col=(s.t==='외국인'&&s.a)?(NC[s.a]||'#95a5a6'):TC[s.t];
    if(!svgCache[col]){
      svgCache[col]='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="6" fill="'+col+'" stroke="white" stroke-width="1.5"/></svg>');
    }
    var m=new kakao.maps.Marker({
      position:new kakao.maps.LatLng(s.y,s.x),
      image:new kakao.maps.MarkerImage(svgCache[col],new kakao.maps.Size(14,14),{offset:new kakao.maps.Point(7,7)})
    });
    var group=pcGroups[s.p];
    kakao.maps.event.addListener(m,'click',function(){iw.setContent(makeGroupContent(group));iw.open(mp,m)});
    markers.push(m);
  });

  clusterer=new kakao.maps.MarkerClusterer({map:mp,markers:markers,gridSize:60,minLevel:1,disableClickZoom:false,averageCenter:true,
    minClusterSize:2,
    calculator:[5,20,50,100],
    styles:[
      {width:'20px',height:'20px',background:'rgba(26,115,232,.7)',borderRadius:'50%',color:'#fff',textAlign:'center',fontWeight:'700',lineHeight:'20px',fontSize:'9px'},
      {width:'35px',height:'35px',background:'rgba(26,115,232,.75)',borderRadius:'50%',color:'#fff',textAlign:'center',fontWeight:'700',lineHeight:'35px',fontSize:'11px'},
      {width:'50px',height:'50px',background:'rgba(26,115,232,.8)',borderRadius:'50%',color:'#fff',textAlign:'center',fontWeight:'700',lineHeight:'50px',fontSize:'13px'},
      {width:'65px',height:'65px',background:'rgba(26,115,232,.88)',borderRadius:'50%',color:'#fff',textAlign:'center',fontWeight:'700',lineHeight:'65px',fontSize:'14px'},
      {width:'80px',height:'80px',background:'rgba(26,115,232,.95)',borderRadius:'50%',color:'#fff',textAlign:'center',fontWeight:'700',lineHeight:'80px',fontSize:'16px'}
    ]
  });
  uS();uH();
}

function uS(){var v=vis(),tc={};v.forEach(function(s){tc[s.t]=(tc[s.t]||0)+1});var h='<div class="sr"><span>표시 학생</span><span class="v">'+v.length.toLocaleString()+'명</span></div>';['외국인','학령기','성인','위탁'].forEach(function(t){if(tc[t])h+='<div class="sr"><span style="color:'+TC[t]+'">'+t+'</span><span class="v">'+tc[t].toLocaleString()+'</span></div>'});document.getElementById('sm').innerHTML=h}
function uH(){var v=vis();document.getElementById('hs').textContent='전체 '+S.length.toLocaleString()+'명 중 '+v.length.toLocaleString()+'명 표시'}

function buildUI(){
  var td=document.getElementById('tf'),tC={};
  S.forEach(function(s){if(s.y)tC[s.t]=(tC[s.t]||0)+1});
  ['외국인','학령기','성인','위탁'].forEach(function(t){
    var l=document.createElement('label');
    l.innerHTML='<input type=checkbox checked><span class="cd" style="background:'+TC[t]+'"></span>'+t+'<span class="cb">'+(tC[t]||0).toLocaleString()+'</span>';
    l.querySelector('input').addEventListener('change',function(e){if(e.target.checked)aT.add(t);else aT.delete(t);render()});
    td.appendChild(l);
  });
  var nd=document.getElementById('nf'),nC={};
  S.filter(function(s){return s.t==='외국인'&&s.y}).forEach(function(s){if(s.a)nC[s.a]=(nC[s.a]||0)+1});
  Object.entries(nC).sort(function(a,b){return b[1]-a[1]}).forEach(function(e){
    var nt=e[0],cnt=e[1];
    var l=document.createElement('label');
    l.innerHTML='<input type=checkbox checked><span class="cd" style="background:'+(NC[nt]||'#95a5a6')+'"></span>'+nt+'<span class="cb">'+cnt.toLocaleString()+'</span>';
    l.querySelector('input').addEventListener('change',function(ev){if(ev.target.checked)aN.add(nt);else aN.delete(nt);render()});
    nd.appendChild(l);
  });
}

window.tAT=function(){var c=document.querySelectorAll('#tf input[type=checkbox]'),a=Array.from(c).every(function(x){return x.checked});c.forEach(function(x){x.checked=!a});if(a)aT.clear();else aT=new Set(['외국인','학령기','성인','위탁']);render()};
window.tAN=function(){var c=document.querySelectorAll('#nf input[type=checkbox]'),a=Array.from(c).every(function(x){return x.checked});c.forEach(function(x){x.checked=!a});if(a)aN.clear();else{S.forEach(function(s){if(s.a)aN.add(s.a)})}render()};
</script>
